# First virtual gamepad from the GPIO daemon. Button indices match the evdev
# order in GAMEPAD_CAPS (src/gpio_daemon.py): 0=BTN_SOUTH (BTN 1), 1=BTN_EAST
# (BTN 2), 2=BTN_NORTH (BTN 3), 3=BTN_WEST (BTN 4), 4=BTN_TL (BTN 5),
# 5=BTN_TR (BTN 6), 6=BTN_SELECT (Coin), 7=BTN_START (Start).
#
# RetroPad layout: Y=BTN 1, X=BTN 2, L=BTN 3, B=BTN 4, A=BTN 5, R=BTN 6.
# Hotkeys: hold Coin (hotkey enable) + Start to exit, + BTN 3 load state,
# + BTN 6 save state, + BTN 2 menu, + BTN 4 reset.
input_device = "Pi Arcade Controller"
input_driver = "udev"
input_enable_hotkey_btn = "6"
input_l_btn = "2"
input_load_state_btn = "2"
input_up_axis = "-1"
input_left_axis = "-0"
input_state_slot_decrease_axis = "-0"
input_select_btn = "6"
input_right_axis = "+0"
input_state_slot_increase_axis = "+0"
input_r_btn = "5"
input_save_state_btn = "5"
input_y_btn = "0"
input_x_btn = "1"
input_menu_toggle_btn = "1"
input_down_axis = "+1"
input_start_btn = "7"
input_exit_emulator_btn = "7"
input_b_btn = "3"
input_reset_btn = "3"
input_a_btn = "4"
